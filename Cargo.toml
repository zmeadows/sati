[package]
name = "sati"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A quiet, persistent terminal checklist"
license = "MIT"
readme = "README.md"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
fs4 = "1.1.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
