[package]
name = "sati"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A quiet, persistent terminal checklist"
license = "MIT"
readme = "README.md"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
crossterm = "0.29.0"
fs4 = "1.1.0"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"
