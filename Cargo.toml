[package]
name = "sati"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A quiet, persistent terminal checklist"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zmeadows/sati"
keywords = ["todo", "checklist", "tui", "terminal"]
categories = ["command-line-utilities"]
# crates.io resolves the README's relative links and demo image against the repository,
# so the demo recording and repository automation do not belong in the source package.
exclude = ["/.github/", "/assets/", "/.editorconfig"]

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[dependencies]
nucleo-matcher = "0.3.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
unicode-segmentation = "1.12"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde-well-known"] }
atomic-write-file = "0.3.1"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }

# For the Linux and macOS backend in tests/interactive/unix.rs. Crossterm already
# depends on rustix; these features add its safe PTY, termios, and session calls without a new crate.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { version = "1.1", features = ["process", "pty", "stdio", "termios"] }

# For the Windows backend in tests/interactive/windows.rs. Clap and mio already depend
# on windows-sys; these features add the ConPTY, pipe, and process calls without a new crate.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
