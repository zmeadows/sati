# sati configuration with every option at its built-in default.
#
# Copy this file to the default location for your platform (see "Configuration" in README.md)
# or pass it with `--config PATH`. Every key is optional and everything below is already the
# default, so keep only the lines you change. Command-line flags override these settings.

# The color theme. Run `sati --list-themes` to see the built-in themes.
theme = "default"

[display]
wrap = true                       # true or false
border_style = "square"           # "square" or "rounded"
task_markers = "unicode"          # "unicode" (›, [✓], [↪]) or "ascii" (>, [x], [>])
status_messages = true            # true or false; false hides routine messages, never errors
status_message_duration_ms = 3560 # milliseconds per message (errors too), a positive integer
show_help_hint = true             # true or false

[input]
mouse = true                      # true or false; false leaves the mouse to the terminal

# Style overrides have no default entries: any [styles.*] setting replaces what the chosen
# theme provides for that role. Uncomment and edit only the ones you want.
#
# Roles: normal (task text and background), muted (secondary text), completed (completed
#     tasks), border, accent (focus, current tab, prompts), heading (section prefixes and
#     reference titles), and carryover_marker (the arrow in a carried task's checkbox).
# fg: an ANSI color name such as "lightyellow", "#RRGGBB", a palette index such as "208",
#     or "reset" for the terminal foreground (not allowed for accent).
# bg: "#RRGGBB" or "reset" only.
# modifiers: any of "bold", "dim", "italic", "underline", "strikethrough"; the list replaces
#     the inherited modifiers, and [] clears them.
# See "Configuration" in README.md for how roles inherit from one another.

# [styles.normal]
# fg = "reset"
# bg = "#20242d"

# [styles.muted]
# modifiers = ["dim"]

# [styles.completed]
# fg = "darkgray"

# [styles.border]
# fg = "darkgray"
# modifiers = []

# [styles.accent]
# fg = "#e78a4e"
# modifiers = ["bold"]

# [styles.heading]
# fg = "#a9b665"
# modifiers = []

# [styles.carryover_marker]
# fg = "#d8a657"
# modifiers = []
