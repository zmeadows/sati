name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-24.04
    steps:
      # Full history, including main, so the ancestry check cannot be misled by a shallow clone.
      # Checkout resolves the tag to its commit, so HEAD works for lightweight and annotated tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the tagged commit is on main
        run: |
          commit=$(git rev-parse HEAD)
          main=$(git rev-parse --verify refs/remotes/origin/main)
          if ! git merge-base --is-ancestor "$commit" "$main"; then
            echo "::error::$GITHUB_REF_NAME points to $commit, which is not reachable from main"
            exit 1
          fi

  ci:
    needs: provenance
    uses: ./.github/workflows/ci.yml

  build:
    needs: [provenance, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build, verify, and package
        shell: python
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import tarfile
          import tempfile
          import tomllib
          import zipfile

          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} must match Cargo.toml version v{version}")
          rust = subprocess.check_output(["rustc", "-vV"], text=True)
          target = next(line.removeprefix("host: ") for line in rust.splitlines() if line.startswith("host: "))
          if target != os.environ["EXPECTED_TARGET"]:
              raise SystemExit(f"Unexpected Rust host target: {target}")
          subprocess.run(["cargo", "build", "--release", "--locked"], check=True)
          binary = Path("target/release") / ("sati.exe" if os.name == "nt" else "sati")

          def verify_version(executable):
              actual = subprocess.check_output([str(executable.resolve()), "--version"], text=True).strip()
              if actual != f"sati {version}":
                  raise SystemExit(f"Unexpected executable version from {executable}: {actual!r}")

          verify_version(binary)
          dist = Path("dist")
          dist.mkdir()
          extension = "zip" if os.name == "nt" else "tar.gz"
          archive = dist / f"sati-{tag}-{target}.{extension}"
          if extension == "zip":
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as output:
                  output.write(binary, binary.name)
                  output.write("LICENSE", "LICENSE")
          else:
              with tarfile.open(archive, "w:gz") as output:
                  output.add(binary, arcname=binary.name)
                  output.add("LICENSE", arcname="LICENSE")
          with tempfile.TemporaryDirectory(prefix="sati-package-") as directory:
              extracted = Path(directory)
              expected = sorted([binary.name, "LICENSE"])
              if extension == "zip":
                  with zipfile.ZipFile(archive) as contents:
                      if sorted(contents.namelist()) != expected:
                          raise SystemExit(f"Incorrect archive contents: {archive}")
                      contents.extractall(extracted)
              else:
                  with tarfile.open(archive) as contents:
                      members = contents.getmembers()
                      if (sorted(member.name for member in members) != expected
                              or not all(member.isfile() for member in members)):
                          raise SystemExit(f"Incorrect archive contents: {archive}")
                      contents.extractall(extracted, filter="data")
              if sorted(path.name for path in extracted.iterdir()) != expected:
                  raise SystemExit(f"Incorrect extracted files: {archive}")
              executable = extracted / binary.name
              if os.name != "nt" and not executable.stat().st_mode & 0o111:
                  raise SystemExit(f"Executable permission missing after extraction: {archive}")
              verify_version(executable)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          archive.with_name(archive.name + ".sha256").write_text(f"{digest}  {archive.name}\n", encoding="utf-8")
      - uses: actions/upload-artifact@v7
        with:
          name: sati-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Verify release assets and assemble checksums
        shell: python3 {0}
        run: |
          import hashlib
          import os
          from pathlib import Path
          import shutil
          import tarfile
          import tomllib
          import zipfile

          tag = os.environ["GITHUB_REF_NAME"]
          version = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))["package"]["version"]
          if tag != f"v{version}":
              raise SystemExit("Tag does not match Cargo.toml")
          targets = [
              ("x86_64-unknown-linux-gnu", "tar.gz"),
              ("aarch64-unknown-linux-gnu", "tar.gz"),
              ("aarch64-apple-darwin", "tar.gz"),
              ("x86_64-apple-darwin", "tar.gz"),
              ("x86_64-pc-windows-msvc", "zip"),
          ]
          artifacts = Path("artifacts")
          if {path.name for path in artifacts.iterdir()} != {f"sati-{target}" for target, _ in targets}:
              raise SystemExit("Missing or unexpected platform artifacts")
          dist = Path("dist")
          dist.mkdir()
          checksums = []
          for target, extension in targets:
              name = f"sati-{tag}-{target}.{extension}"
              directory = artifacts / f"sati-{target}"
              if {path.name for path in directory.iterdir()} != {name, name + ".sha256"}:
                  raise SystemExit(f"Missing or unexpected files in {directory}")
              archive = directory / name
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              line = f"{digest}  {name}\n"
              if archive.with_name(name + ".sha256").read_text() != line:
                  raise SystemExit(f"Checksum mismatch: {name}")
              if name.endswith(".zip"):
                  with zipfile.ZipFile(archive) as contents:
                      members = contents.namelist()
                      if contents.testzip() is not None:
                          raise SystemExit(f"Corrupt archive: {name}")
                  binary = "sati.exe"
              else:
                  with tarfile.open(archive) as contents:
                      entries = contents.getmembers()
                      members = [entry.name for entry in entries]
                      if not all(entry.isfile() for entry in entries):
                          raise SystemExit(f"Non-file archive entry: {name}")
                      if not contents.getmember("sati").mode & 0o111:
                          raise SystemExit(f"Executable permission missing: {name}")
                  binary = "sati"
              if sorted(members) != sorted([binary, "LICENSE"]):
                  raise SystemExit(f"Incorrect archive contents: {name}")
              shutil.copyfile(archive, dist / name)
              checksums.append(line)
          (dist / "SHA256SUMS").write_text("".join(checksums), encoding="utf-8")
          Path("release-notes.md").write_text(
              "A small, persistent terminal checklist.\n\n"
              "Download and extract the archive for your platform; Rust is not required. "
              "Each archive includes the MIT license. Verify downloads using SHA256SUMS.\n\n"
              "Linux: x86_64 and ARM64, GNU/glibc, built on Ubuntu 22.04 for an older glibc baseline; "
              "compatibility with every Linux system is not guaranteed.\n"
              "macOS: Apple Silicon and Intel, in separate archives.\n"
              "Windows: x86_64 MSVC.\n", encoding="utf-8")
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --draft --title "sati $TAG" --notes-file release-notes.md
