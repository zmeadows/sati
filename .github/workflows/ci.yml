name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The interactive tests bound their own waits; this catches anything else that hangs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Test
        if: ${{ !cancelled() }}
        # The interactive scenarios run in the independent step below. Keep them in
        # ordinary local `cargo test` runs, but avoid running them twice in CI.
        run: >-
          cargo test --locked --
          --skip session_moves_the_selection_and_exits_cleanly
          --skip session_modifies_a_task_and_reloads_its_status_and_selection
          --skip session_resizes_and_remains_responsive
          --skip restores_the_terminal
      # Storage/terminal unit failures must not prevent Windows locking coverage.
      - name: Verify Windows process locking
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --locked --test locking
      # Like the locking check, independent of other test failures. Require the shared baseline
      # on every platform, rather than passing vacuously with no executable scenario.
      - name: Verify interactive terminal session
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo test --locked --test interactive -- --list \
            | grep -q '^session_moves_the_selection_and_exits_cleanly: test$' \
            || { echo "::error::no interactive baseline was built for $RUNNER_OS"; exit 1; }
          cargo test --locked --test interactive
      - name: Build release
        if: ${{ !cancelled() }}
        run: cargo build --release --locked
      - name: Install Rust 1.89
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Check Rust 1.89 compatibility
        if: matrix.os == 'ubuntu-latest'
        run: cargo +1.89.0 check --locked --all-targets
