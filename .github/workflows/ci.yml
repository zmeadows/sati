name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The interactive tests bound their own waits; this catches anything else that hangs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check all targets
        run: cargo check --locked --all-targets
      - name: Test
        if: ${{ !cancelled() }}
        run: cargo test --locked
      # Storage/terminal unit failures must not prevent Windows locking coverage.
      - name: Verify Windows process locking
        if: ${{ !cancelled() && matrix.os == 'windows-latest' }}
        run: cargo test --locked --test locking
      # Like the locking check, independent of other test failures. Each platform's harness
      # compiles to no tests elsewhere, so an empty list fails rather than passing vacuously.
      - name: Verify interactive terminal session
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then test=interactive_conpty; else test=interactive_pty; fi
          cargo test --locked --test "$test" -- --list | grep -q ': test$' \
            || { echo "::error::no $test tests were built for $RUNNER_OS"; exit 1; }
          cargo test --locked --test "$test"
      - name: Build release
        if: ${{ !cancelled() }}
        run: cargo build --release --locked
      - name: Install Rust 1.89
        if: matrix.os == 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@1.89.0
      - name: Check Rust 1.89 compatibility
        if: matrix.os == 'ubuntu-latest'
        run: cargo +1.89.0 check --locked --all-targets
